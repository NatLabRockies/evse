name: Test and build UI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build production UI
        run: pnpm build

      - name: Build staging UI
        run: pnpm build:staging

      - name: Upload UI builds
        uses: actions/upload-artifact@v7
        with:
          name: evse-dashboard
          path: dist/evse-dashboard
          if-no-files-found: error
