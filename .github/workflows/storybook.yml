name: Storybook visual tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Update the Linux reference screenshots
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual-tests:
    name: Visual and accessibility tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run visual tests
        run: pnpm test-storybook ${{ inputs.update-screenshots && '--update' || '' }}

      # On failure this holds the new screenshots and diffs; on an update run, the new references.
      - name: Upload screenshots
        if: ${{ failure() || inputs.update-screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: storybook-screenshots
          path: |
            .storybook/screenshots/linux/
            .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
