<div ngTabs>
  <header class="h-36 bg-white sm:h-62 standalone:max-sm:h-54" aria-labelledby="page-title">
    <div
      class="mx-auto flex h-26 max-w-3xl flex-col items-start justify-between pt-[max(--spacing(4),env(safe-area-inset-top))] pr-[calc(--spacing(12)+env(safe-area-inset-right))] pl-[calc(--spacing(12)+env(safe-area-inset-left))] sm:h-52 sm:pt-[calc(--spacing(16)+env(safe-area-inset-top))] sm:pr-[calc(--spacing(9)+env(safe-area-inset-right))] sm:pl-[calc(--spacing(9)+env(safe-area-inset-left))] standalone:max-sm:h-44 standalone:max-sm:pt-[calc(max(--spacing(4),env(safe-area-inset-top))+(--spacing(6)))]"
    >
      <img
        class="pointer-events-none block h-9 w-auto select-none sm:h-12"
        ngSrc="nlr-logo.svg"
        width="598"
        height="100"
        priority
        alt="National Laboratory of the Rockies"
      />

      <h1
        id="page-title"
        class="mb-2.75 text-[2rem] leading-none font-bold whitespace-nowrap text-nlr-blue outline-none max-[360px]:text-[1.75rem] sm:text-[2.5rem]"
        tabindex="-1"
      >
        FIND A CHARGER
      </h1>
    </div>

    <div
      class="campus-tabs mx-auto flex h-10 max-w-3xl pr-[calc(--spacing(5.5)+env(safe-area-inset-right))] pl-[calc(--spacing(5.5)+env(safe-area-inset-left))] sm:pr-[calc(--spacing(10)+env(safe-area-inset-right))] sm:pl-[calc(--spacing(10)+env(safe-area-inset-left))]"
      ngTabList
      aria-label="Campus"
      [selectedTab]="campus()"
      (selectedTabChange)="selectCampus($event)"
    >
      @for (campus of campuses; track campus.id) {
        <button
          class="flex flex-1 cursor-pointer items-center justify-center rounded-t bg-[#d9d9d9] px-3 text-2xl leading-[1.2] font-bold text-nlr-blue focus-visible:z-1 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-nlr-blue aria-selected:bg-nlr-deep-blue aria-selected:text-white"
          ngTab
          [value]="campus.id"
          type="button"
        >
          {{ campus.label }}
        </button>
      }
    </div>
  </header>

  <main
    class="min-h-[calc(var(--app-height)-(--spacing(36)))] bg-[linear-gradient(180deg,var(--color-nlr-deep-blue)_0%,#0d5d99_100%)] pt-4 pr-[calc(--spacing(5.5)+env(safe-area-inset-right))] pb-[calc(--spacing(16)+env(safe-area-inset-bottom))] pl-[calc(--spacing(5.5)+env(safe-area-inset-left))] text-white sm:min-h-[calc(var(--app-height)-(--spacing(62)))] sm:pt-6 sm:pr-[calc(--spacing(10)+env(safe-area-inset-right))] sm:pb-[calc(--spacing(16)+env(safe-area-inset-bottom))] sm:pl-[calc(--spacing(10)+env(safe-area-inset-left))] standalone:max-sm:min-h-[calc(var(--app-height)-(--spacing(54)))]"
  >
    @for (campus of campuses; track campus.id) {
      <section class="mx-auto max-w-3xl" ngTabPanel [value]="campus.id">
        <ng-template ngTabContent>
          <app-campus-availability [campus]="campus.id" />
        </ng-template>
      </section>
    }
  </main>
</div>
